name: telegram-tools-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Everything both services need. Anything listed here without a default is
# required in `.env`; the Zod schema fails the process at startup if it is wrong.
x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: ${LOG_PRETTY:-false}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
  TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
  # Point TELEGRAM_API_ROOT at the `telegram-bot-api` service below and set this
  # true to lift the 50 MB upload ceiling. TELEGRAM_USE_LOCAL_API is the older
  # spelling of the same switch, kept so an existing .env keeps working; set
  # both to the SAME value, because two different answers to one question are
  # refused rather than silently resolved.
  TELEGRAM_LOCAL_MODE: ${TELEGRAM_LOCAL_MODE:-}
  TELEGRAM_USE_LOCAL_API:
  # Composed from POSTGRES_* and the service names — any DATABASE_URL in .env is
  # deliberately ignored here, because inside this network the host is always
  # `postgres` and a stale localhost URL from a developer's .env would fail in a
  # confusing way.
  DATABASE_URL: postgresql://${POSTGRES_USER:-tgtools}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-telegram_tools}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_URL: redis://redis:6379
  QUEUE_REMOVE_COMPLETE_AFTER_SECONDS: ${QUEUE_REMOVE_COMPLETE_AFTER_SECONDS:-3600}
  QUEUE_REMOVE_FAIL_AFTER_SECONDS: ${QUEUE_REMOVE_FAIL_AFTER_SECONDS:-604800}
  DOWNLOAD_DIR: /data/downloads
  # 2000, not 500. With TELEGRAM_LOCAL_MODE=true the upload ceiling becomes
  # 1900 MB, and the config's coherence rule refuses to start when the
  # download ceiling sits below it — so a 500 default turned "enable local
  # mode" into a container that would not boot.
  MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-2000}
  # The documented name for MAX_UPLOAD_MB below, and the one variable here
  # written with NO value. It has to be able to arrive genuinely unset, because
  # the right ceiling depends on local mode — 50 against the public API, 1900
  # against your own server — and `${...:-}` would deliver an empty string,
  # which the schema coerces to 0 and rejects for being below its `>= 1` bound.
  # With no value Compose resolves it from .env and drops it from the
  # container's environment entirely when it is not set there.
  TELEGRAM_UPLOAD_LIMIT_MB:
  # Same no-value form, and for the same reason: a `${...:-50}` default would
  # arrive SET on every deployment, so a local-mode stack would be declaring 50
  # here and 1900 above — two different answers to one question, which startup
  # refuses rather than silently resolves.
  MAX_UPLOAD_MB:
  # Above this an incompatible codec ships as a document rather than being
  # re-encoded. Set by how long a person will wait, not by what the host can
  # survive.
  MAX_TRANSCODE_MB: ${MAX_TRANSCODE_MB:-80}
  # Deliver a playable file as it is rather than spending minutes re-encoding
  # it: a 4K AV1 clip transcodes for longer than most users will wait, and
  # arriving promptly as a document is the better trade.
  VIDEO_FAST_DELIVERY: ${VIDEO_FAST_DELIVERY:-true}
  MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-2048}
  MEDIA_INSPECT_TIMEOUT_MS: ${MEDIA_INSPECT_TIMEOUT_MS:-30000}
  DOWNLOAD_TIMEOUT_MS: ${DOWNLOAD_TIMEOUT_MS:-900000}
  FFMPEG_TIMEOUT_MS: ${FFMPEG_TIMEOUT_MS:-900000}
  FFPROBE_TIMEOUT_MS: ${FFPROBE_TIMEOUT_MS:-30000}
  TELEGRAM_UPLOAD_TIMEOUT_MS: ${TELEGRAM_UPLOAD_TIMEOUT_MS:-900000}
  JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS:-3600000}
  DOWNLOAD_WORKER_CONCURRENCY: ${DOWNLOAD_WORKER_CONCURRENCY:-2}
  DOWNLOAD_JOB_ATTEMPTS: ${DOWNLOAD_JOB_ATTEMPTS:-2}
  DOWNLOAD_JOB_BACKOFF_MS: ${DOWNLOAD_JOB_BACKOFF_MS:-5000}
  DOWNLOAD_JOB_LOCK_DURATION_MS: ${DOWNLOAD_JOB_LOCK_DURATION_MS:-60000}
  WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-30000}
  PROGRESS_UPDATE_INTERVAL_MS: ${PROGRESS_UPDATE_INTERVAL_MS:-3000}
  PROGRESS_UPDATE_MIN_PERCENT: ${PROGRESS_UPDATE_MIN_PERCENT:-5}
  MEDIA_INFO_CACHE_TTL_SECONDS: ${MEDIA_INFO_CACHE_TTL_SECONDS:-600}
  DOWNLOAD_SELECTION_TTL_SECONDS: ${DOWNLOAD_SELECTION_TTL_SECONDS:-1800}
  ORPHAN_WORKSPACE_MAX_AGE_HOURS: ${ORPHAN_WORKSPACE_MAX_AGE_HOURS:-6}
  MAINTENANCE_INTERVAL_MS: ${MAINTENANCE_INTERVAL_MS:-900000}
  MAX_ACTIVE_JOBS_PER_USER: ${MAX_ACTIVE_JOBS_PER_USER:-2}
  RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-20}
  INSPECT_RATE_LIMIT_MAX: ${INSPECT_RATE_LIMIT_MAX:-10}
  FFMPEG_VIDEO_CODEC: ${FFMPEG_VIDEO_CODEC:-libx264}
  FFMPEG_AUDIO_CODEC: ${FFMPEG_AUDIO_CODEC:-aac}
  FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
  FFMPEG_CRF: ${FFMPEG_CRF:-23}
  STORE_FULL_SOURCE_URL: ${STORE_FULL_SOURCE_URL:-false}
  # Read-only mounts under /run/secrets. Leave the host paths unset to run
  # fully unauthenticated — see docs/security.md before supplying any of these.
  INSTAGRAM_COOKIES_PATH: ${INSTAGRAM_COOKIES_PATH:-}
  TIKTOK_COOKIES_PATH: ${TIKTOK_COOKIES_PATH:-}
  X_COOKIES_PATH: ${X_COOKIES_PATH:-}
  PINTEREST_COOKIES_PATH: ${PINTEREST_COOKIES_PATH:-}
  YOUTUBE_COOKIES_PATH: ${YOUTUBE_COOKIES_PATH:-}
  # Account-free alternatives to a cookie file; see .env.example.
  YTDLP_PROXY: ${YTDLP_PROXY:-}
  INSTAGRAM_EXTRACTOR_ARGS: ${INSTAGRAM_EXTRACTOR_ARGS:-}
  TIKTOK_EXTRACTOR_ARGS: ${TIKTOK_EXTRACTOR_ARGS:-}
  X_EXTRACTOR_ARGS: ${X_EXTRACTOR_ARGS:-}
  PINTEREST_EXTRACTOR_ARGS: ${PINTEREST_EXTRACTOR_ARGS:-}
  YOUTUBE_EXTRACTOR_ARGS: ${YOUTUBE_EXTRACTOR_ARGS:-}
  YOUTUBE_POT_PROVIDER_URL: ${YOUTUBE_POT_PROVIDER_URL:-}
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgtools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_tools}
      # Deterministic ordering and UTF-8 regardless of the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgtools} -d ${POSTGRES_DB:-telegram_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # `appendonly` because the queue is the only record that a user's job was
    # accepted; losing it on restart loses their request.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Proof-of-origin token provider. Optional, free, and off by default.
  #
  # YouTube answers a flagged address with "sign in to confirm you're not a
  # bot", which is a demand for a PO token — an attestation that the request came
  # from a real browser. This service mints them locally, so the bot can answer
  # without an account and without a paid residential proxy.
  #
  # Enabled ONLY by setting YOUTUBE_POT_PROVIDER_URL; with that variable empty
  # the container still starts but nothing ever calls it. Bound to the internal
  # network with no published port: it is not something to expose.
  #
  # Honest caveat, from the project's own README: a PO token "may help your
  # traffic seem more legitimate" but does not guarantee a bypass.
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:${POT_PLUGIN_VERSION:-1.3.1}
    restart: unless-stopped
    logging: *logging
    init: true
    # Probed with `node`, not curl. This is a slim Node image that ships neither
    # curl nor wget, so a curl-based check reported a perfectly healthy provider
    # as `(unhealthy)` forever — a false alarm is worse than no check, because it
    # sends an operator debugging the one part that was working. `node` is the
    # image's own entrypoint and cannot be missing. `/ping` is the provider's
    # documented liveness route. (The `-deno` flavour of this image would need
    # `deno` here instead; the tag above pins the Node one.)
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "require('http').get('http://127.0.0.1:4416/ping', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  # Your own Bot API server. This is the only way past the 50 MB upload limit.
  #
  # That limit is a property of Telegram's PUBLIC endpoint, not of the token, so
  # no configuration on our side can raise it — and 50 MB is smaller than most
  # videos worth downloading. A server you run yourself accepts up to 2000 MB,
  # of which this stack uses 1900: the 2000 is measured on the encoded multipart
  # body, so a ceiling set at exactly 2000 fails at the end of a long upload.
  #
  # `aiogram/telegram-bot-api` is the maintained community build of
  # tdlib/telegram-bot-api, which ships source but no image of its own.
  #
  # Running the container changes nothing by itself: the bot and worker keep
  # talking to api.telegram.org until .env redirects them (see .env.example):
  #   TELEGRAM_API_ROOT=http://telegram-bot-api:8081
  #   TELEGRAM_LOCAL_MODE=true
  #   TELEGRAM_UPLOAD_LIMIT_MB=1900
  telegram-bot-api:
    image: aiogram/telegram-bot-api:${TELEGRAM_BOT_API_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      # An APPLICATION identity from https://my.telegram.org, not the bot token
      # and not derivable from it. The server exits at once without both, so
      # they are demanded here — a missing value should stop a deploy, not
      # produce a container that restarts forever.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required by the telegram-bot-api service. Create an application at https://my.telegram.org (API development tools). This is NOT your bot token}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required by the telegram-bot-api service. Create an application at https://my.telegram.org (API development tools). This is NOT your bot token}
      # `--local`. The entire point of the service: without it the server is a
      # private relay that still refuses anything over 50 MB.
      TELEGRAM_LOCAL: 1
    # Reachable as `telegram-bot-api:8081` from this network and nowhere else.
    # Deliberately NOT published: the port carries a bot token in the URL path
    # and authenticates nothing itself.
    expose:
      - "8081"
    # TDLib session and per-bot state. Deleting it costs every bot a fresh
    # authorisation on the next start.
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    # NO healthcheck, deliberately — see `bgutil-provider` above for what a
    # wrong one costs. That image ships `node`, so its probe cannot be missing.
    # This one is `alpine` plus `openssl` and `libstdc++`: no curl, no wget, no
    # interpreter to fall back on. Anything written here would be a guess, and a
    # guess that fails reports a perfectly healthy server as `(unhealthy)`
    # forever — worse than no check at all.
    #
    # There is also nothing honest to probe. The server answers only
    # `/bot<token>/<method>`, so a check that could tell "serving" from "dead"
    # would have to carry the bot token in a command line that `docker inspect`
    # prints.
    #
    # Nothing therefore depends_on this service: with no healthcheck the only
    # available condition is `service_started`, which says a process was exec'd
    # and nothing about whether it is listening. Reachability comes from sharing
    # the network, not from startup order.
    networks: [internal]

  # One-shot. Migrations must not run from the services themselves: two
  # replicas booting at once would race on the same DDL, and a failed migration
  # should stop a deploy rather than crash-loop a bot.
  #
  # It shares the WORKER'S IMAGE TAG deliberately. Without an explicit `image:`,
  # Compose derives a separate name per service, so `docker compose build
  # bot worker` left this one holding whatever it was built with last — and a
  # stale migrate image finds no pending migrations and exits 0, silently. One
  # tag means the two cannot drift apart.
  migrate:
    image: ${WORKER_IMAGE:-telegram-tools-bot-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.07.04}
        DENO_VERSION: ${DENO_VERSION:-v2.9.4}
        POT_PLUGIN_VERSION: ${POT_PLUGIN_VERSION:-1.3.1}
    restart: "no"
    logging: *logging
    environment: *app-env
    command: ["node", "apps/worker/dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.07.04}
        DENO_VERSION: ${DENO_VERSION:-v2.9.4}
        POT_PLUGIN_VERSION: ${POT_PLUGIN_VERSION:-1.3.1}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      BOT_HEALTH_PORT: 3001
    # Bound to loopback: the health endpoint is for the host's monitoring, not
    # for the internet.
    ports:
      - "127.0.0.1:${BOT_HEALTH_PORT:-3001}:3001"
    # No download volume: this process is not supposed to be able to write media.
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Long enough for the bot to stop polling and close its connections.
    stop_grace_period: 30s
    networks: [internal]

  worker:
    # Same tag as `migrate`; see the comment there.
    image: ${WORKER_IMAGE:-telegram-tools-bot-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.07.04}
        DENO_VERSION: ${DENO_VERSION:-v2.9.4}
        POT_PLUGIN_VERSION: ${POT_PLUGIN_VERSION:-1.3.1}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 3002
    ports:
      - "127.0.0.1:${WORKER_HEALTH_PORT:-3002}:3002"
    volumes:
      - downloads:/data/downloads
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Must exceed WORKER_SHUTDOWN_GRACE_MS, or Docker SIGKILLs the worker while
    # it is still giving an in-flight download its chance to finish.
    stop_grace_period: 90s
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  # Not scratch: the local Bot API server's session state lives here, and losing
  # it makes every bot re-authorise on the next start.
  telegram-bot-api-data:
  # Scratch space. Every job creates and deletes its own directory here; nothing
  # in it is expected to survive a restart.
  downloads:

networks:
  internal:
    driver: bridge
